name: Package Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to publish (e.g. 0.2.0). Leave blank to auto-increment patch."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # needed to read the latest tag
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Resolve version ----
      # - push:tags        → use the tag version (v0.1.6 → 0.1.6); do NOT auto-increment
      # - workflow_dispatch → explicit input, else auto-increment patch
      # Applies the resolved version to package.json + openclaw.plugin.json so the
      # published artifact's package & manifest versions stay in sync.
      - name: Resolve & apply version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              # Auto-increment patch of the current package.json version.
              VERSION="$(node -p "const v=require('./package.json').version.split('.').map(Number); v[2]=(v[2]||0)+1; v.join('.')")"
            fi
          fi
          echo "Using version: $VERSION"
          node -e "
            const fs=require('fs');
            for (const f of ['package.json','openclaw.plugin.json']) {
              const p=JSON.parse(fs.readFileSync(f,'utf8'));
              p.version=process.argv[1];
              fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n');
            }
          " "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate with ClawHub Plugin Inspector
        run: npx clawhub package validate . --openclaw-version 2026.7.1-2

      - name: Publish to ClawHub
        run: |
          npx clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          npx clawhub package publish . \
            --owner wiwiwa \
            --name openclaw-sandcastle \
            --version "${{ steps.version.outputs.version }}" \
            --categories security \
            --topics sandbox \
            --source-repo wiwiwa/openclaw-sandcastle \
            --manual-override-reason "CI publish via token-authenticated workflow (trusted-publisher config set)" \
            --json
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
